[application]
name = "PhotoExchanger"
default_platform = "web"
asset_dir = "assets"

[web.app]
title = "PhotoEx"
base_path = "photo-ex"

[bundle]
identifier = "com.jhfactory.poca00"
publisher = "PhotoExchanger"
icon = ["assets/icons/icon.png"]

# Unified permissions: maps to android.permission.USE_BIOMETRIC and iOS NSFaceIDUsageDescription.
[permissions]
biometrics = { description = "Face ID / 지문으로 빠르게 로그인합니다." }
photos = { description = "포토카드 및 프로필 사진을 등록하기 위해 사진 보관함에 접근합니다." }
camera = { description = "포토카드 및 프로필 사진을 촬영하여 등록하기 위해 카메라에 접근합니다." }
